# Template: Activepieces Community Edition (MIT — ADR-003) per-tenant
# Biến mustache: DOMAIN, VENTURE_SLUG, APP_SECRET, DB_PASSWORD
services:
  ap-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=activepieces
      - POSTGRES_PASSWORD={{DB_PASSWORD}}
      - POSTGRES_DB=activepieces
    volumes:
      - ap-db-data:/var/lib/postgresql/data

  ap-redis:
    image: redis:7-alpine
    restart: unless-stopped

  activepieces:
    image: ghcr.io/activepieces/activepieces:latest
    restart: unless-stopped
    depends_on:
      - ap-db
      - ap-redis
    environment:
      - AP_FRONTEND_URL=https://{{DOMAIN}}
      - AP_JWT_SECRET={{APP_SECRET}}
      - AP_ENCRYPTION_KEY={{APP_SECRET}}
      - AP_POSTGRES_HOST=ap-db
      - AP_POSTGRES_PORT=5432
      - AP_POSTGRES_USERNAME=activepieces
      - AP_POSTGRES_PASSWORD={{DB_PASSWORD}}
      - AP_POSTGRES_DATABASE=activepieces
      - AP_REDIS_HOST=ap-redis
      - AP_REDIS_PORT=6379
    labels:
      - traefik.enable=true
      - traefik.http.routers.{{VENTURE_SLUG}}-flow.rule=Host(`{{DOMAIN}}`)
      - traefik.http.routers.{{VENTURE_SLUG}}-flow.entrypoints=https
      - traefik.http.routers.{{VENTURE_SLUG}}-flow.tls.certresolver=letsencrypt

volumes:
  ap-db-data:
