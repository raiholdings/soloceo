# Template: Claw3D — văn phòng ảo 3D (ADR-005, approach B).
# Dùng image ĐÃ VÁ dựng sẵn soloceo/claw3d:patched (xem infra/patches/claw3d).
# Bản gốc build-from-git KHÔNG chạy production (thiếu typescript runtime + chặn public bind).
# Biến mustache: DOMAIN, VENTURE_SLUG
services:
  claw3d:
    image: soloceo/claw3d:patched
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.http.routers.{{VENTURE_SLUG}}-claw3d.rule=Host(`{{DOMAIN}}`)
      - traefik.http.routers.{{VENTURE_SLUG}}-claw3d.entrypoints=https
      - traefik.http.routers.{{VENTURE_SLUG}}-claw3d.tls=true
      - traefik.http.routers.{{VENTURE_SLUG}}-claw3d.tls.certresolver=letsencrypt
      - traefik.http.services.{{VENTURE_SLUG}}-claw3d.loadbalancer.server.port=3000
