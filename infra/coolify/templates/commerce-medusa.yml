# Template: Medusa.js — thương mại điện tử quốc tế (GROWTH+)
# Biến mustache: DOMAIN, VENTURE_SLUG, APP_SECRET, DB_PASSWORD
services:
  medusa-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=medusa
      - POSTGRES_PASSWORD={{DB_PASSWORD}}
      - POSTGRES_DB=medusa
    volumes:
      - medusa-db-data:/var/lib/postgresql/data

  medusa-redis:
    image: redis:7-alpine
    restart: unless-stopped

  medusa:
    image: medusajs/medusa:latest
    restart: unless-stopped
    depends_on:
      - medusa-db
      - medusa-redis
    environment:
      - DATABASE_URL=postgres://medusa:{{DB_PASSWORD}}@medusa-db:5432/medusa
      - REDIS_URL=redis://medusa-redis:6379
      - JWT_SECRET={{APP_SECRET}}
      - COOKIE_SECRET={{APP_SECRET}}
      - STORE_CORS=https://{{DOMAIN}}
    labels:
      - traefik.enable=true
      - traefik.http.routers.{{VENTURE_SLUG}}-commerce.rule=Host(`{{DOMAIN}}`)
      - traefik.http.routers.{{VENTURE_SLUG}}-commerce.entrypoints=https
      - traefik.http.routers.{{VENTURE_SLUG}}-commerce.tls.certresolver=letsencrypt

volumes:
  medusa-db-data:
