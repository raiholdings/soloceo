# Template: OpenClaw — trợ lý ra lệnh AI (ADR-005, approach B).
# Image dựng sẵn soloceo/openclaw:patched (build từ openclaw/openclaw, Dockerfile
# gốc build OK — không cần vá; chỉ cần config runtime).
# LLM đi qua LiteLLM (nguyên tắc bất biến — OpenAI-compatible).
# Biến mustache: DOMAIN, VENTURE_SLUG, APP_SECRET, LITELLM_BASE_URL, LITELLM_VIRTUAL_KEY
services:
  openclaw:
    # soloceo2 = vá header Control UI (frame-ancestors + bỏ X-Frame-Options) cho nhúng iframe
    image: soloceo/openclaw:soloceo2
    restart: unless-stopped
    # gateway headless: allow-unconfigured + token (bind public an toàn)
    command: ["node", "openclaw.mjs", "gateway", "--allow-unconfigured"]
    environment:
      - OPENCLAW_GATEWAY_TOKEN={{APP_SECRET}}
      # Model qua LiteLLM gateway (Claude Haiku/Sonnet)
      - OPENAI_API_BASE={{LITELLM_BASE_URL}}
      - OPENAI_API_KEY={{LITELLM_VIRTUAL_KEY}}
      - OPENCLAW_DEFAULT_MODEL=soloceo-smart
      - OPENCLAW_MODEL=soloceo-smart
    volumes:
      - openclaw-data:/tmp/openclaw
    labels:
      - traefik.enable=true
      - traefik.http.routers.{{VENTURE_SLUG}}-openclaw.rule=Host(`{{DOMAIN}}`)
      - traefik.http.routers.{{VENTURE_SLUG}}-openclaw.entrypoints=https
      - traefik.http.routers.{{VENTURE_SLUG}}-openclaw.tls=true
      - traefik.http.routers.{{VENTURE_SLUG}}-openclaw.tls.certresolver=letsencrypt
      - traefik.http.services.{{VENTURE_SLUG}}-openclaw.loadbalancer.server.port=18789

volumes:
  openclaw-data:
