# g3proxy — egress DUY NHẤT của AIO Sandbox (SoloCEO OS v2, N7).
# Forward HTTP proxy + allowlist domain. Non-match = CHẶN. Resolver hickory
# (build không c-ares). Sandbox trỏ HTTP(S)_PROXY về đây.
runtime:
  thread_number: 2
controller:
  local:
    recv_timeout: 30
    send_timeout: 1
log:
  default:
    journal: {}      # audit egress vào journald (docker logs)

server:
  - name: tenant_egress
    escaper: allowlist
    type: http_proxy
    listen:
      address: "0.0.0.0:3128"
    # Allowlist khởi điểm: hệ thống SoloCEO + LLM + thanh toán + cổng công VN + TMĐT.
    dst_host_filter_set:
      exact:
        - api.anthropic.com
        - ark.ap-southeast.bytepluses.com
      child:
        - soloceo.vn
        - stripe.com
        - payos.vn
        - vnpay.vn
        - gov.vn            # dichvucong/thuedientu/dangkykinhdoanh/baohiemxahoi...
        - gdt.gov.vn
        - shopee.vn
        - lazada.vn
        - tiki.vn
        - sendo.vn
        - google.com
        - zalo.me

resolver:
  - name: default
    type: hickory
    server:
      - 1.1.1.1
      - 8.8.8.8

escaper:
  - name: allowlist
    type: direct_fixed
    resolver: default
    resolve_strategy: IPv4First
