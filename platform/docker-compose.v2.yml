# Stack dịch vụ bảo mật v2 (research/R6) — deploy trên CORE (rules/dlp) + T2 (egress).
# KHÔNG mở ra internet: rules/dlp chỉ trong network coolify nội bộ.
# Build image trước: mỗi thư mục có Dockerfile riêng.
services:
  svc-rules-engine:
    image: localhost:5000/soloceo/svc-rules-engine:v1
    environment:
      DATABASE_URL: ${DATABASE_URL}       # trỏ Postgres core (bảng Rule)
      PORT: "8080"
    networks: [coolify]
    restart: unless-stopped

  svc-dlp:
    image: localhost:5000/soloceo/svc-dlp:v1
    environment:
      PORT: "8080"
    networks: [coolify]
    restart: unless-stopped

  # g3proxy chạy trên T2 cùng AIO Sandbox (network internal) — xem research/PHA3-deploy.md bước 2.

networks:
  coolify:
    external: true
